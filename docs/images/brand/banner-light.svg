<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" fill="none">
  <defs>
    <linearGradient id="sw-bl-bg" x1="0" y1="0" x2="1200" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="60%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="sw-bl-mark" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#064E3B"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="sw-bl-wave" x1="12" y1="42" x2="52" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="100%" stop-color="#A7F3D0"/>
    </linearGradient>
    <linearGradient id="sw-bl-null" x1="748" y1="120" x2="748" y2="222" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#94A3B8" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="sw-bl-swing" x1="748" y1="186" x2="1128" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Card Surface -->
  <rect width="1200" height="280" rx="16" fill="url(#sw-bl-bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="279" rx="15.5" stroke="#CBD5E1"/>

  <!-- Left: Brand Mark (64x64) -->
  <g transform="translate(48, 46)">
    <rect width="64" height="64" rx="14" fill="url(#sw-bl-mark)"/>
    <rect x="1" y="1" width="62" height="62" rx="13" stroke="#6EE7B7" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="12" y1="36" x2="52" y2="36" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="3 3"/>
    <path d="M12 40C17 40 19 24 25 24C31 24 33 44 39 44C44 44 47 22 52 18" stroke="url(#sw-bl-wave)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="18" r="3.2" fill="#ECFDF5"/>
    <circle cx="19" cy="18" r="6" fill="#064E3B" stroke="#6EE7B7" stroke-width="1.6"/>
    <path d="M16.5 18L18.2 19.7L21.7 16.2" stroke="#6EE7B7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Left: Title & Tagline -->
  <text x="130" y="78" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#0F172A" letter-spacing="-0.02em">swing-it</text>
  <text x="130" y="104" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#059669" letter-spacing="0.06em">STATISTICAL ALPHA SCREENING FRAMEWORK</text>

  <text x="48" y="152" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="500" fill="#334155">Statistical validation against randomized negative controls.</text>

  <!-- Left: Tech Pills -->
  <g transform="translate(48, 184)">
    <rect width="114" height="30" rx="15" fill="#D1FAE5" stroke="#6EE7B7"/>
    <text x="57" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#065F46">Python 3.11+</text>

    <rect x="124" width="142" height="30" rx="15" fill="#F1F5F9" stroke="#CBD5E1"/>
    <text x="195" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#334155">Purge &amp; Embargo</text>

    <rect x="276" width="124" height="30" rx="15" fill="#ECFDF5" stroke="#34D399"/>
    <text x="338" y="20" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#047857">95th Pct Gate</text>
  </g>

  <!-- Right: Domain Artwork (Null Distribution Bell Curve + 95th Pct Gate + Swing Wave) -->
  <g>
    <rect x="724" y="28" width="428" height="224" rx="14" fill="#FFFFFF" stroke="#E2E8F0"/>
    <path d="M748 92H1128M748 148H1128M748 204H1128" stroke="#F1F5F9" stroke-width="1"/>
    <!-- Baseline -->
    <line x1="748" y1="220" x2="1128" y2="220" stroke="#CBD5E1" stroke-width="1.5"/>

    <!-- Null Distribution Bell Curve (5,000 random strategies) -->
    <path d="M754 220 C795 220 824 198 852 146 C874 105 890 88 910 88 C930 88 946 105 968 146 C996 198 1025 220 1066 220 Z" fill="url(#sw-bl-null)"/>
    <path d="M754 220 C795 220 824 198 852 146 C874 105 890 88 910 88 C930 88 946 105 968 146 C996 198 1025 220 1066 220" stroke="#94A3B8" stroke-width="2" stroke-dasharray="4 3"/>

    <!-- 95th Percentile Gate Line -->
    <line x1="1010" y1="50" x2="1010" y2="222" stroke="#059669" stroke-width="2" stroke-dasharray="5 4"/>
    <rect x="962" y="42" width="96" height="22" rx="6" fill="#D1FAE5" stroke="#6EE7B7"/>
    <text x="1010" y="57" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#065F46">95th PCT GATE</text>

    <!-- Passing Swing Wave -->
    <path d="M756 188 C796 188 814 142 848 142 C882 142 900 198 938 198 C972 198 994 128 1030 106 C1062 86 1094 74 1122 68" stroke="url(#sw-bl-swing)" stroke-width="3.6" stroke-linecap="round"/>

    <!-- Gate Pass Node -->
    <circle cx="1122" cy="68" r="7" fill="#10B981" fill-opacity="0.22"/>
    <circle cx="1122" cy="68" r="4" fill="#059669"/>
  </g>
</svg>
