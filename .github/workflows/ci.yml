name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # 파이프라인 가드를 없앴을 때 시험이 정말 빨개지는가(docs/PIPELINE.md). 인터프리터별로 달라질 것이 없어 한 번만 돈다.
  pipeline-mutations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Fetch base for ledger check
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Pipeline guard mutations
        run: python scripts/check_pipeline_mutations.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src/ tests/ research/ scripts/ examples/
      # 린트 (k) 가 기준 브랜치의 원장과 비교한다(끝 줄 잘라내기). 체크아웃은 얕고 그 ref 가 없다.
      - name: Fetch base for ledger check
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Guardrails
        run: python scripts/check_guardrails.py
      - name: Test
        run: pytest -q
