[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swing-it"
version = "0.1.0"
description = "코스피·코스닥 알파 리서치 라이브러리 — 개별 트레이드 분포·walk-forward·음성대조를 강제하는 검증 가드레일과 정직한 부정 결과 (데이터 수집은 quant-airflow)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = [
    "quant", "퀀트", "alpha-research", "backtesting", "walk-forward",
    "overfitting", "pead", "supply-demand", "수급", "kospi", "kosdaq", "kiwoom", "키움",
]
authors = [{ name = "Younghwan Chae", email = "chyohw97@gmail.com" }]
dependencies = [
    "pandas>=2.0",
    # 검증 통계·성과지표·횡단면 루프·가격제한폭의 정본. 세 레포(scalp-it·daytrade-it·
    # swing-it)가 같은 수익열에서 같은 숫자를 내게 하려고 공유한다. 태그로 고정.
    "krx-quant-core @ git+https://github.com/younghwan91/krx-quant-core@v0.1.1",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8"]
pg = ["psycopg2-binary>=2.9"]
dev = ["pytest>=8.0", "ruff==0.16.2", "matplotlib>=3.8"]

[project.scripts]
# 데이터 수집 CLI(kq-collect*)는 collectors/와 함께 quant-airflow로 이전됨.
#
# 이 저장소는 검증 프레임워크지 스크리너 제품이 아니다. 2026-08-16 에 스크리너·ML·차트
# CLI 7종(kq-screen/backtest/supply-wave/graph-flow/multi-signal/ensemble-signal/chart)을
# 구현과 함께 삭제했다 — 전부 `supply_demand JOIN stocks`(생존자 전용) 위에서 분할
# 미조정 종가로 돌던 코드라, 남겨두면 이 저장소가 강제한다고 적어둔 규율의 반례였다.
# 남은 하나는 게이트를 통과한 유일한 알파의 재현 CLI다.
sw-pead = "swing_it.strategies.pead:main"
# SSH 에서 보는 섹터 자금흐름 화면. 일일 리포트가 만든 JSON 만 읽는다(DB 미접속).
sw-flow = "swing_it.tui.flow_app:main"
sw-ledger = "swing_it.tui.ledger_app:main"

[project.urls]
Repository = "https://github.com/younghwan91/swing-it"

[tool.hatch.metadata]
# krx-quant-core 를 git 태그로 직접 참조한다(PyPI 미배포).
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/swing_it"]

[tool.ruff.lint]
# 룰셋을 명시한다 — ruff 기본 선택은 릴리스마다 넓어지므로, 그대로 두면 코드를 건드리지
# 않아도 CI가 갑자기 빨개진다(0.16에서 실제 발생). dev extra의 ruff 핀과 한 쌍이다.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# repo 루트를 sys.path에 추가 → bare `pytest`도 research/ 모듈을 찾음(CI가 `python -m pytest`
# 없이도 통과). numba/optuna는 옵셔널이라 미설치 환경에선 해당 테스트가 importorskip으로 스킵됨.
pythonpath = ["."]
