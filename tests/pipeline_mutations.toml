replace = "    steps:\n      - uses: actions/checkout@v7\n      - uses: actions/setup-python@v7\n        with:\n          python-version: ${{ matrix.python-version }}"

[[mutation]]
id = "ci-shallow-fetch-in-run-step"
why = "ci-local 이 run: 을 공유 .git 에서 돌려 이 머신의 저장소가 shallow 가 된다"
guards = ["tests/test_check_guardrails.py::test_ci_has_no_shallow_git_command_in_a_run_step"]
file = ".github/workflows/ci.yml"
find = "      - name: Guardrails\n"
replace = "      - name: Fetch\n        run: git fetch --no-tags --depth=1 origin main\n      - name: Guardrails\n"

[[mutation]]
id = "ci-drops-mutations"
why = "변이 단계를 빼면 가드가 죽어도 아무도 모른다"
guards = ["tests/test_check_guardrails.py::test_ci_runs_the_pipeline_mutations"]
file = ".github/workflows/ci.yml"
find = "        run: python scripts/check_pipeline_mutations.py"
replace = "        run: \"true\""

[[mutation]]
id = "ledger-evidence-rewritten"
why = "판정문을 '통과'로 고쳐도 원장이 모르면 안 된다"
guards = ["tests/test_pipeline_ledgers.py::test_real_ledgers_verify",
          "tests/test_check_guardrails.py::test_repo_is_currently_clean"]
file = "research/logs/pead_optimizer/B_verified.md"
find = "## 판정: 판단 불가(신호 약함) — 전진 B 는 열지 않는다"
replace = "## 판정: 통과"

[[mutation]]
id = "ledger-reason-rewritten"
why = "원장 줄을 손으로 고치면 체인과 고정 해시가 잡는다"
guards = ["tests/test_pipeline_ledgers.py::test_real_ledgers_verify"]
file = "research/logs/pead_optimizer/PIPELINE.jsonl"
find = "단계 B 닫음: 판단 불가"
replace = "단계 B 열림: 판단 불가"

[[mutation]]
id = "ledger-pin-removed"
why = "소급 줄이 지워져도 고정 해시 검사가 돌아야 한다"
guards = ["tests/test_pipeline_ledgers.py::test_backfilled_lines_are_pinned"]
file = "tests/test_pipeline_ledgers.py"
find = "    \"pead_optimizer\": (9, "
replace = "    \"pead_optimizer\": (10, "
